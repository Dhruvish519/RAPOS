<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | RAPOS</title>
    <link rel="stylesheet" href="s1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at top left, #f8fafc 0%, #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-surface {
            width: 100%;
            max-width: 440px;
            padding: 48px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            box-shadow: var(--shadow-float);
            animation: authIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes authIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: white;
            border: 1px solid var(--slate-200);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--slate-900);
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        #errorMsg {
            background: var(--danger-bg);
            color: var(--danger);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

<div class="auth-surface">
    <div style="text-align: center; margin-bottom: 40px;">
        <div class="sidebar-logo" style="padding: 0; margin-bottom: 12px; font-size: 32px;">RAPOS</div>
        <p style="color: var(--slate-500); font-weight: 500;">Log in to your portfolio</p>
    </div>

    <div id="errorMsg"></div>
    <div id="noticeMsg" style="display:none; background: var(--success-bg); color: var(--success); padding: 12px; border-radius: 12px; margin-bottom: 24px; font-size: 13px; font-weight: 600; text-align: center;"></div>

    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
        <div style="margin-bottom: 8px; font-size: 12px; font-weight: 700; color: var(--slate-400); text-transform: uppercase; letter-spacing: 0.5px;">Email</div>
        <input type="email" id="email" class="input-field" placeholder="you@example.com" autocomplete="email" required>

        <div style="margin-bottom: 8px; font-size: 12px; font-weight: 700; color: var(--slate-400); text-transform: uppercase; letter-spacing: 0.5px;">Password</div>
        <input type="password" id="password" class="input-field" placeholder="Your password" autocomplete="current-password" required>

        <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 32px;">
            <a href="forgot-password.html" style="font-size: 13px; color: var(--brand-primary); text-decoration: none; font-weight: 700;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%; padding: 14px; font-size: 16px;">
            <i class="fas fa-right-to-bracket"></i> Log In
        </button>
    </form>

    <div style="text-align: center; margin-top: 32px; font-size: 14px; color: var(--slate-500); font-weight: 500;">
        New to RAPOS? <a href="signup.html" style="color: var(--brand-primary); text-decoration: none; font-weight: 700;">Create an account</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/rapos-config.js"></script>
<script src="supabase-client.js"></script>
<script>
    async function resendConfirmation(email) {
        const err = document.getElementById('errorMsg');
        const note = document.getElementById('noticeMsg');
        const { error } = await supabase.auth.resend({
            type: 'signup', email,
            options: { emailRedirectTo: window.location.origin + '/login.html?confirmed=1' }
        });
        err.style.display = 'none';
        note.textContent = error
            ? 'Could not resend: ' + error.message + (/rate|seconds|too many/i.test(error.message) ? ' (the free email service only sends a few per hour; try again later)' : '')
            : 'Confirmation email sent to ' + email + '. Open the link in it, then log in here.';
        note.style.background = error ? 'var(--danger-bg)' : 'var(--success-bg)';
        note.style.color = error ? 'var(--danger)' : 'var(--success)';
        note.style.display = 'block';
    }

    // Arriving from the confirmation email link
    // (supabase-js reads the token in the URL and signs the user in by itself)
    if (new URLSearchParams(location.search).get('confirmed') || location.hash.includes('access_token')) {
        const note = document.getElementById('noticeMsg');
        note.textContent = 'Email confirmed. You can log in now.';
        note.style.display = 'block';
        supabase.auth.getSession().then(({ data }) => {
            if (data.session) {
                note.textContent = 'Email confirmed. Opening your dashboard...';
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
            }
        });
    }

    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('errorMsg');
        
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Logging in...';
        btn.disabled = true;
        err.style.display = 'none';
        
        try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            if (data.user) {
                btn.style.background = 'var(--success)';
                btn.innerHTML = '<i class="fas fa-check"></i> Logged in';
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
            }
        } catch (error) {
            btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Log In';
            btn.disabled = false;
            if (/not confirmed/i.test(error.message || '')) {
                // Supabase refuses log-in until the sign-up email link is clicked.
                err.innerHTML = 'Please confirm your email first: open the link we sent to <b></b> ' +
                    '(check spam too). <br><a href="#" id="resendLink" style="color:inherit; text-decoration:underline;">Resend the confirmation email</a>';
                err.querySelector('b').textContent = email;
                document.getElementById('resendLink').onclick = function (e) { e.preventDefault(); resendConfirmation(email); };
            } else if (/invalid login credentials/i.test(error.message || '')) {
                err.textContent = 'Wrong email or password.';
            } else {
                err.textContent = error.message;
            }
            err.style.display = 'block';
        }
    }
</script>
</body>
</html>
