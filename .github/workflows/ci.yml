name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Tesseract (Chart Vision axis OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      # Not requirements-dev.txt: that pulls in PyTorch (the PyTorch-vs-NumPy
      # LSTM test skips itself when torch isn't installed). matplotlib is
      # needed because the tests render synthetic charts to digitise.
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pytest httpx matplotlib

      - name: Backend tests
        run: cd backend && python -m pytest -q

      - name: Frontend JavaScript syntax check
        run: |
          for f in js/*.js supabase-client.js; do
            echo "node --check $f"
            node --check "$f"
          done
