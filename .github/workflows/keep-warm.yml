name: Keep backend warm

# Render's free plan sleeps after 15 minutes idle; the first request then takes
# 30-60 s. Pinging the health endpoint every 10 minutes keeps it awake.
# Note: GitHub may delay scheduled runs at busy times and disables schedules
# in repos with no activity for 60 days.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://rapos-api.onrender.com/api/health
