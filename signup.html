<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | RAPOS</title>
    <link rel="stylesheet" href="s1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at top right, #f8fafc 0%, #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .auth-surface {
            width: 100%;
            max-width: 540px;
            padding: 48px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            box-shadow: var(--shadow-float);
            animation: authIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes authIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: white;
            border: 1px solid var(--slate-200);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--slate-900);
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        #errorMsg {
            background: var(--success-bg);
            color: var(--success);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            text-align: center;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        @media (max-width: 500px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="auth-surface">
    <div style="text-align: center; margin-bottom: 40px;">
        <div class="sidebar-logo" style="padding: 0; margin-bottom: 12px; font-size: 32px;">RAPOS</div>
        <p style="color: var(--slate-500); font-weight: 500;">Create your RAPOS account</p>
    </div>

    <div id="errorMsg"></div>

    <form id="signupForm" onsubmit="event.preventDefault(); handleSignup();">
        <div class="form-grid">
            <div>
                <div style="margin-bottom: 8px; font-size: 11px; font-weight: 700; color: var(--slate-400); text-transform: uppercase;">First Name</div>
                <input type="text" id="firstName" class="input-field" placeholder="John" required>
            </div>
            <div>
                <div style="margin-bottom: 8px; font-size: 11px; font-weight: 700; color: var(--slate-400); text-transform: uppercase;">Last Name</div>
                <input type="text" id="lastName" class="input-field" placeholder="Doe" required>
            </div>
        </div>

        <div style="margin-bottom: 8px; font-size: 11px; font-weight: 700; color: var(--slate-400); text-transform: uppercase;">Email</div>
        <input type="email" id="email" class="input-field" placeholder="you@example.com" autocomplete="email" required>

        <div style="margin-bottom: 8px; font-size: 11px; font-weight: 700; color: var(--slate-400); text-transform: uppercase;">Password</div>
        <input type="password" id="password" class="input-field" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>

        <div style="margin-bottom: 8px; font-size: 11px; font-weight: 700; color: var(--slate-400); text-transform: uppercase;">Investing Experience</div>
        <select id="experience" class="input-field" required>
            <option value="" disabled selected>Select level</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select>

        <p style="font-size: 12px; color: var(--slate-400); margin-bottom: 32px; line-height: 1.6;">
            RAPOS is a student project. Your email and portfolio are stored in Supabase and are only visible to you. We'll email you a link to confirm your address.
        </p>

        <button type="submit" class="btn btn-primary" id="signupBtn" style="width: 100%; padding: 14px; font-size: 16px;">
            <i class="fas fa-user-plus"></i> Create Account
        </button>
    </form>

    <div style="text-align: center; margin-top: 32px; font-size: 14px; color: var(--slate-500); font-weight: 500;">
        Already have an account? <a href="login.html" style="color: var(--brand-primary); text-decoration: none; font-weight: 700;">Log in</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/rapos-config.js"></script>
<script src="supabase-client.js"></script>
<script>
    async function handleSignup() {
        const full_name = document.getElementById('firstName').value + " " + document.getElementById('lastName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const investment_exp = document.getElementById('experience').value;
        
        const btn = document.getElementById('signupBtn');
        const msg = document.getElementById('errorMsg');
        
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Creating account...';
        btn.disabled = true;
        msg.style.display = 'none';

        try {
            const { data, error } = await supabase.auth.signUp({
                email, password,
                options: {
                    data: { full_name, investment_exp },
                    // the confirmation link brings the user back to this site's log-in page
                    emailRedirectTo: window.location.origin + '/login.html?confirmed=1'
                }
            });
            if (error) throw error;

            btn.style.background = 'var(--success)';
            msg.style.display = 'block';
            msg.style.background = 'var(--success-bg)';
            msg.style.color = 'var(--success)';
            if (data.session) {
                // email confirmation is off: already signed in
                btn.innerHTML = '<i class="fas fa-check"></i> Account created';
                msg.textContent = 'Account created. Opening your dashboard...';
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
            } else if (data.user && data.user.identities && data.user.identities.length === 0) {
                // Supabase's answer when the email is already registered
                btn.style.background = '';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                msg.innerHTML = 'This email already has an account. <a href="login.html" style="color:inherit; text-decoration:underline;">Log in</a> instead.';
            } else {
                btn.innerHTML = '<i class="fas fa-envelope"></i> Check your email';
                msg.innerHTML = 'Almost done: we sent a confirmation link to <b></b>. Open it to activate your account, then log in. ' +
                    'Can\'t find it? Check spam, or resend it from the log-in page.';
                msg.querySelector('b').textContent = email;
            }
        } catch (error) {
            btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            btn.disabled = false;
            msg.textContent = error.message;
            msg.style.display = 'block';
            msg.style.background = 'var(--danger-bg)';
            msg.style.color = 'var(--danger)';
        }
    }
</script>
</body>
</html>
