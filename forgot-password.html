<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | RAPOS</title>
    <link rel="stylesheet" href="s1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at top left, #f8fafc 0%, #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-surface {
            width: 100%;
            max-width: 440px;
            padding: 48px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            box-shadow: var(--shadow-float);
            animation: authIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes authIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: white;
            border: 1px solid var(--slate-200);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--slate-900);
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        #errorMsg {
            background: var(--danger-bg);
            color: var(--danger);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

<div class="auth-surface">
    <div style="text-align: center; margin-bottom: 40px;">
        <div class="sidebar-logo" style="padding: 0; margin-bottom: 12px; font-size: 32px;">RAPOS</div>
        <p style="color: var(--slate-500); font-weight: 500;">Reset your password</p>
    </div>

    <div id="errorMsg"></div>
    <div id="noticeMsg" style="display:none; background: var(--success-bg); color: var(--success); padding: 12px; border-radius: 12px; margin-bottom: 24px; font-size: 13px; font-weight: 600; text-align: center;"></div>

    <form id="resetForm" onsubmit="event.preventDefault(); sendReset();">
        <p style="font-size: 14px; color: var(--slate-500); margin-bottom: 20px; line-height: 1.6;">Enter the email you signed up with and we'll send you a link to choose a new password.</p>
        <div style="margin-bottom: 8px; font-size: 12px; font-weight: 700; color: var(--slate-400); text-transform: uppercase; letter-spacing: 0.5px;">Email</div>
        <input type="email" id="email" class="input-field" placeholder="you@example.com" autocomplete="email" required>

        <button type="submit" class="btn btn-primary" id="sendBtn" style="width: 100%; padding: 14px; font-size: 16px;">
            <i class="fas fa-paper-plane"></i> Send Reset Link
        </button>
    </form>

    <div style="text-align: center; margin-top: 32px; font-size: 14px; color: var(--slate-500); font-weight: 500;">
        Remembered it? <a href="login.html" style="color: var(--brand-primary); text-decoration: none; font-weight: 700;">Back to log in</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/rapos-config.js"></script>
<script src="supabase-client.js"></script>
<script>
    function show(id, text) {
        const el = document.getElementById(id);
        el.textContent = text; el.style.display = text ? 'block' : 'none';
    }

    async function sendReset() {
        const email = document.getElementById('email').value.trim();
        const btn = document.getElementById('sendBtn');
        show('errorMsg', ''); show('noticeMsg', '');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Sending...';
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/reset-password.html'
        });
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
        if (error) {
            show('errorMsg', 'Could not send the email: ' + error.message +
                (/rate|seconds|too many/i.test(error.message) ? ' (the free email service only sends a few per hour; try again later)' : ''));
        } else {
            // Supabase doesn't reveal whether an account exists for this email
            show('noticeMsg', 'If an account exists for ' + email + ', a reset link is on its way. Check spam too.');
        }
    }
</script>
</body>
</html>
